services:
  mt5:
    build: .
    image: gmag11/metatrader5_vnc
    volumes:
      # Use a Docker-managed volume, not ./config. Dokploy deletes the whole
      # repository checkout (code/) at the start of every deployment, so a bind
      # mount inside it both loses all Wine/MT5 data and fails with
      # "Directory not empty" while the previous container is still writing to it.
      - mt5-config:/config
    ports:
      - 3100:3100
      - 8001:8001
    environment:
      - UID=${UID:-1000}
      - GID=${GID:-1000}
      - CUSTOM_PORT=${CUSTOM_PORT:-3100}
      - CUSTOM_USER=${CUSTOM_USER}
      - PASSWORD=${PASSWORD}
      - MT5_LOGIN=${MT5_LOGIN:-}
      - MT5_PASSWORD=${MT5_PASSWORD:-}
      - MT5_SERVER=${MT5_SERVER:-}
      - MT5_CMD_OPTIONS=${MT5_CMD_OPTIONS:-}
      # Wine/Windows display scaling for MT5: 96=100%, 120=125%, 144=150%, 168=175%.
      - MT5_DPI=${MT5_DPI:-144}

volumes:
  mt5-config:
